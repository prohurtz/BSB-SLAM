name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  native:
    name: Native driver tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests -B build/native-tests -A x64
      - run: cmake --build build/native-tests --config Release --parallel
      - run: ctest --test-dir build/native-tests -C Release --output-on-failure
